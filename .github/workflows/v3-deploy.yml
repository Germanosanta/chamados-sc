name: V3 Deploy (Homologação)

# Publica a V3 no site de Hosting "chamados-sc-v3" (alvo "v3" em
# .firebaserc/firebase.json) — mesmo projeto Firebase da V2 (chamdos-sc),
# site separado, sem afetar o site "chamados-sc" (produção, V2). Reusa o
# mesmo secret FIREBASE_SERVICE_ACCOUNT já configurado para o deploy da
# V2 (firebase-deploy.yml) — o papel "Firebase Hosting Admin" é por
# projeto, não por site, então a mesma credencial já tem permissão aqui.
#
# Pré-requisito único (manual, uma vez só): o site "chamados-sc-v3" ainda
# não existe — precisa ser criado antes do primeiro deploy. Ver
# v3/docs/DEPLOY.md, "Passo 1".
#
# Só roda depois que V3 CI (v3-ci.yml) já validou type-check/lint/build
# nas duas versões de Node — este workflow builda de novo (não reaproveita
# o artefato do CI) porque a action de deploy precisa do diretório
# v3/dist presente no mesmo job que publica.
on:
  push:
    branches: [main]
    paths:
      - "v3/**"
      - ".github/workflows/v3-deploy.yml"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch: {}

permissions:
  contents: read

# Um novo push cancela qualquer deploy anterior ainda em andamento —
# nunca dois deploys da V3 correndo em paralelo pro mesmo site.
concurrency:
  group: v3-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + Deploy V3 (Hosting)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v3-${{ hashFiles('v3/package-lock.json', 'v3/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-v3-

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Deploy só deve publicar código já validado — repete as mesmas 2
      # checagens do CI (não reaproveita o resultado do v3-ci.yml porque
      # workflows do GitHub Actions não compartilham estado entre si sem
      # complexidade extra de artifacts; type-check+lint de um único build
      # em Node 22 aqui é rápido o suficiente pra não valer essa complexidade).
      - name: Type-check (tsc -b)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      # Config pública do client Firebase (mesmo projeto/valores já
      # expostos no bundle da V2) — não é segredo, ver v3/.env.example.
      - name: Preparar variáveis de ambiente
        run: cp .env.example .env

      - name: Build (Vite)
        run: npm run build

      - name: Deploy no Firebase Hosting (v3)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: chamdos-sc
          target: v3
          entryPoint: .
          channelId: live

      - name: Resumo da execução
        if: always()
        run: |
          {
            echo "## V3 Deploy — Resumo"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Site | chamados-sc-v3 |"
            echo "| Alvo (firebase.json) | v3 |"
            echo "| Projeto Firebase | chamdos-sc |"
            echo "| Canal | live |"
          } >> "$GITHUB_STEP_SUMMARY"
