name: V3 CI

# Principal ferramenta de validação da V3 (React/TS em v3/): instala
# dependências, type-checka, linta, builda e publica o artefato de build
# — em 2 versões de Node (matrix) — a cada push/PR que toque v3/**. Não
# publica em nenhum Hosting ainda (a V3 é experimental até substituir
# oficialmente a V2). Não afeta o workflow de deploy da V2
# (firebase-deploy.yml), que continua publicando só docs/.
on:
  push:
    branches: [main]
    paths:
      - "v3/**"
      - ".github/workflows/v3-ci.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/v3-ci.yml"
  workflow_dispatch: {}

# Permissão mínima necessária: só ler o código e publicar o job summary /
# artefato (upload-artifact não exige nenhuma permissão de escrita no
# repositório).
permissions:
  contents: read

# Um novo push cancela qualquer execução anterior ainda rodando para o
# mesmo branch/PR — inclusive todas as pernas da matrix dessa execução.
concurrency:
  group: v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        # LTS (22) e Current (24) — cobre tanto o que a maioria roda em
        # produção quanto o próximo LTS, sem depender de uma única
        # versão de Node estar disponível no runner.
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Marcar início da execução
        run: echo "V3_CI_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configurar Node.js ${{ matrix.node-version }}
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Cache manual da pasta de cache do npm (não do node_modules), porque
      # o cache nativo de actions/setup-node exige um package-lock.json já
      # existente para calcular a chave — e ele ainda não foi commitado
      # (nenhum npm install rodou neste projeto até agora, ambiente sem
      # Node.js — ver ROADMAP.md em v3/docs/). hashFiles ignora arquivos
      # inexistentes, então a chave já funciona hoje (baseada só em
      # package.json) e passa a incluir o lockfile automaticamente assim
      # que ele existir. Chave inclui a versão do Node pra não misturar
      # cache de instalações compiladas/otimizadas para versões diferentes.
      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node${{ matrix.node-version }}-npm-v3-${{ hashFiles('v3/package-lock.json', 'v3/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-npm-v3-

      # Usa "npm ci" automaticamente assim que v3/package-lock.json for
      # commitado (instalação reprodutível); até lá, cai para "npm install".
      - name: Instalar dependências
        id: install
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json encontrado — usando npm ci"
            npm ci
          else
            echo "::warning::v3/package-lock.json não encontrado — usando npm install. Gere e commite o lockfile para builds reprodutíveis (troca automática para 'npm ci' já está configurada acima)."
            npm install
          fi

      # noEmit já vem do tsconfig — esta etapa só type-checka (3 projetos
      # via tsc -b: app, node, sw — ver v3/tsconfig.json), não gera
      # artefatos. Qualquer erro aqui interrompe o job imediatamente
      # (nenhuma etapa seguinte roda sem "if: always()"/"if: failure()").
      - name: Type-check (tsc -b)
        id: typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        id: lint
        run: npm run lint

      # Config pública do client Firebase (mesmo projeto/valores já
      # expostos no bundle da V2) — não é segredo, ver v3/.env.example.
      - name: Preparar variáveis de ambiente
        run: cp .env.example .env

      - name: Build (Vite)
        id: build
        run: npm run build

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: v3-dist-node${{ matrix.node-version }}
          path: v3/dist
          retention-days: 14
          if-no-files-found: error

      - name: Resumo da execução
        if: always()
        run: |
          END=$(date +%s)
          DUR=$((END - V3_CI_START))
          MIN=$((DUR / 60))
          SEC=$((DUR % 60))
          {
            echo "## V3 CI — Resumo (Node ${{ matrix.node-version }})"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Node.js (solicitado / resolvido) | ${{ matrix.node-version }} / ${{ steps.setup-node.outputs.node-version }} |"
            echo "| Instalação | ${{ steps.install.outcome }} |"
            echo "| Type-check (tsc -b) | ${{ steps.typecheck.outcome }} |"
            echo "| Lint (ESLint) | ${{ steps.lint.outcome }} |"
            echo "| Build (Vite) | ${{ steps.build.outcome }} |"
            echo "| Artefato | \`v3-dist-node${{ matrix.node-version }}\` (retenção 14 dias) |"
            echo "| Tempo total | ${MIN}m ${SEC}s |"
          } >> "$GITHUB_STEP_SUMMARY"

