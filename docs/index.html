<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Central de Chamados — novo endereço</title>
  <meta http-equiv="refresh" content="3;url=https://chamados-sc-v3.web.app/">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0c1712; color: #1c2b24; }
    main { max-width: 420px; background: #fff; border-radius: 12px; padding: 28px 24px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 18px; line-height: 1.5; color: #4a5a52; }
    a { display: inline-block; background: #2f7a55; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>A Central de Chamados mudou de endereço</h1>
    <p>Esta versão foi desativada. Use o novo endereço e salve-o nos favoritos.</p>
    <a href="https://chamados-sc-v3.web.app/">Abrir a Central de Chamados</a>
  </main>
  <script>
    // Remove o service worker antigo, que podia continuar servindo a V2 do cache.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
    setTimeout(function () { location.replace('https://chamados-sc-v3.web.app/'); }, 3000);
  </script>
</body>
</html>
